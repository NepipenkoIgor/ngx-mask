<div class="flex justify-between items-center bg-ink h-[55px] w-full fixed top-0 px-5 z-30">
    <button
        type="button"
        class="cursor-pointer"
        [attr.aria-label]="showAccordion() ? 'Close navigation menu' : 'Open navigation menu'"
        [attr.aria-expanded]="showAccordion()"
        (click)="showAccordionBlock(); $event.stopPropagation()">
        <img
            width="18"
            height="18"
            [ngSrc]="(showAccordion() ? 'close' : 'burger') | asset: openSourceHeaderPath"
            alt="" />
    </button>
    <div class="flex items-center gap-2.5 flex-1 min-w-0 px-2.5">
        <img
            width="24"
            height="24"
            [ngSrc]="'logo' | asset: openSourceHeaderPath"
            alt=""
            class="shrink-0" />
        <span class="text-h5 text-full-white truncate">{{ title() }}</span>
    </div>
    <div class="flex items-center gap-15px">
        <a
            [href]="githubProfileLink"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="'GitHub' | anchorLabel">
            <img width="18" height="18" [ngSrc]="'github' | asset: openSourceHeaderPath" alt="" />
        </a>
        <a
            [href]="linkedInProfileLink"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="'LinkedIn' | anchorLabel">
            <img width="18" height="18" [ngSrc]="'linkedin' | asset: openSourceHeaderPath" alt="" />
        </a>
        <a
            [href]="upworkProfileLink"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="'Upwork' | anchorLabel">
            <img width="18" height="18" [ngSrc]="'upwork' | asset: openSourceHeaderPath" alt="" />
        </a>
    </div>
</div>

<div
    class="flex flex-col fixed z-20 h-[calc(100%-55px)] overflow-auto bg-ink pt-[22px] w-[300px] top-[55px] tab:w-[300px] tab:top-[54px] desk:w-[300px] desk:top-[55px] mob:w-full p-5"
    [class]="
        showAccordion() ? 'tab:block mob:block desk:block' : 'tab:hidden mob:hidden desk:hidden'
    "
    #accordionBlock>
    <div class="bg-ink flex flex-col gap-5 relative h-full pb-[85px]">
        @for (list of lists(); track list.id; let i = $index) {
            <div
                class="non-active w-full bg-ink text-white cursor-pointer border-t border-b border-accent rounded-10px p-2.5"
                #accordion>
                <div
                    class="flex items-center justify-between bg-ink text-white"
                    aria-hidden="true"
                    (click)="toggle(i); switchAccordion(list.id); $event.stopPropagation()">
                    <div class="flex items-center bg-light-grey-accordion gap-15px">
                        <img
                            width="32"
                            height="32"
                            [ngSrc]="list.defaultSvg | asset: openSourceAccordionPath"
                            class="default-svg"
                            alt="Accordion white" />
                        <img
                            width="32"
                            height="32"
                            [ngSrc]="list.activeSvg | asset: openSourceAccordionPath"
                            class="active-svg"
                            alt="Accordion yellow" />
                        <span class="accordion-title text-text-primary">
                            {{ list.header }}
                        </span>
                    </div>

                    <img
                        width="12"
                        height="12"
                        [ngSrc]="list.whiteChevron | asset: openSourceAccordionPath"
                        class="chevron-default"
                        alt="Chevron white" />
                    <img
                        width="12"
                        height="12"
                        [ngSrc]="list.yellowChevron | asset: openSourceAccordionPath"
                        class="chevron-active"
                        alt="Chevron yellow" />
                </div>
                <div class="panel flex-col text-text-secondary bg-ink pl-[45px]">
                    @for (item of list.text; track item.id) {
                        <p
                            aria-hidden="true"
                            class="cursor-pointer px-2 py-2"
                            [class]="
                                itemInAccordion() === item.id
                                    ? 'text-accent'
                                    : 'text-text-secondary'
                            "
                            (click)="handleClick(item.id, item.scrollTo)">
                            {{ item.content }}
                        </p>
                    }
                </div>
            </div>
        }
        <div class="fixed bottom-5 w-[270px]">
            <ngxd-visit-btn />
        </div>
    </div>
</div>
